<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drawings by LifeIsJustASickJoke</title>
  <script src="https://cdn.tailwindcss.com"></script>
    <style>

    @font-face {
      font-family: 'Blackout Midnight';
      src: url('/fonts/Blackout%20Midnight.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

  </style>
</head>

<body class="text-white min-h-screen flex flex-col bg-[url('drawings/Background.png')] bg-cover bg-center bg-fixed">
  <!-- HEADER -->
  <header class="text-center p-8">
    <h1 class="text-4xl font-extrabold bg-clip-text text-transparent pb-4 bg-gradient-to-r from-indigo-400 via-purple-500 to-cyan-400">
      Drawings by
    </h1>

    <p class="text-lg text-gray-300">
      <a href="https://www.reddit.com/user/LifeIsJustASickJoke" target="_blank"
         class="text-blue-400 underline hover:text-blue-300">
        u/LifeIsJustASickJoke
      </a>
    </p>

    <!-- SORT TOGGLE -->
    <div class="mt-6 flex justify-center gap-4">

      <div id="sortToggle"
           class="relative w-28 h-12 rounded-full cursor-pointer bg-gray-700 overflow-hidden flex items-center">

        <span id="sortSlider"
              class="absolute left-0 w-1/2 h-full bg-indigo-500 rounded-full transition-transform"></span>

        <div class="absolute left-0 w-1/2 h-full flex items-center justify-center font-bold text-white pointer-events-none">
          New
        </div>

        <div class="absolute right-0 w-1/2 h-full flex items-center justify-center font-bold text-white pointer-events-none">
          Old
        </div>

      </div>

    </div>
  </header>

  <!-- GALLERY -->
  <main id="gallery"
        class="grid gap-6 p-6 sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3 pt-0">
  </main>

  <!-- MODAL -->
  <div id="modal"
       class="fixed inset-0 bg-black bg-opacity-80 flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity">

    <span id="prev"
          class="absolute left-5 top-1/2 -translate-y-1/2 text-3xl cursor-pointer select-none p-2">❮</span>

    <img id="modalImage"
         class="max-w-[90%] max-h-[75%] rounded-lg"
         src=""
         alt="Large view">

    <div id="modalText"
         class="mt-4 max-w-[90%] text-center text-gray-300 bg-gray-800/70 border border-gray-700 rounded-lg px-4 py-3">
    </div>

    <span id="next"
          class="absolute right-5 top-1/2 -translate-y-1/2 text-3xl cursor-pointer select-none p-2">❯</span>

  </div>

  <!-- FOOTER -->
  <footer class="text-center p-6 text-gray-400">
    <p>© <span id="year"></span></p>
  </footer>

<script>

let sortOrder = "latest";
let currentIndex = 0;

/* =========================
   DATA
========================= */

const artworks = [
  { id: 1, thumb: "drawings/Drawing1.png", full: "drawings/Drawing1.png", description: "Sketch 1" },
  { id: 2, thumb: "drawings/Drawing2.png", full: "drawings/Drawing2.png", description: "Sketch 2" },
  { id: 3, thumb: "drawings/Drawing3.png", full: "drawings/Drawing3.png", description: "Sketch 3" },
  { id: 4, thumb: "drawings/Drawing4.png", full: "drawings/Drawing4.png", description: "Sketch 4" },
  { id: 5, thumb: "drawings/Drawing5.png", full: "drawings/Drawing5.png", description: "Sketch 5" },

  { id: 6, thumb: "drawings/Drawing6.png", full: "drawings/Drawing6.png", description: "Sketch 6" },
  { id: 7, thumb: "drawings/Drawing7.png", full: "drawings/Drawing7.png", description: "Sketch 7" },
  { id: 8, thumb: "drawings/Drawing8.png", full: "drawings/Drawing8.png", description: "Sketch 8" },
  { id: 9, thumb: "drawings/Drawing9.png", full: "drawings/Drawing9.png", description: "Sketch 9" },
  { id: 10, thumb: "drawings/Drawing10.png", full: "drawings/Drawing10.png", description: "Sketch 10" },

  { id: 11, thumb: "drawings/Drawing11.png", full: "drawings/Drawing11.png", description: "Sketch 11" },
  { id: 12, thumb: "drawings/Drawing12.png", full: "drawings/Drawing12.png", description: "Sketch 12" },
  { id: 13, thumb: "drawings/Drawing13.png", full: "drawings/Drawing13.png", description: "Sketch 13" },
  { id: 14, thumb: "drawings/Drawing14.png", full: "drawings/Drawing14.png", description: "Sketch 14" },
  { id: 15, thumb: "drawings/Drawing15.png", full: "drawings/Drawing15.png", description: "Sketch 15" },

  { id: 16, thumb: "drawings/Drawing16.png", full: "drawings/Drawing16.png", description: "Sketch 16" },
  { id: 17, thumb: "drawings/Drawing17.png", full: "drawings/Drawing17.png", description: "Sketch 17" },
  { id: 18, thumb: "drawings/Drawing18.png", full: "drawings/Drawing18.png", description: "Sketch 18" },
  { id: 19, thumb: "drawings/Drawing19.png", full: "drawings/Drawing19.png", description: "Sketch 19" },
  { id: 20, thumb: "drawings/Drawing20.png", full: "drawings/Drawing20.png", description: "Sketch 20" },

  { id: 21, thumb: "drawings/Drawing21.png", full: "drawings/Drawing21.png", description: "Sketch 21" },
  { id: 22, thumb: "drawings/Drawing22.png", full: "drawings/Drawing22.png", description: "Sketch 22" },
  { id: 23, thumb: "drawings/Drawing23.png", full: "drawings/Drawing23.png", description: "Sketch 23" },
  { id: 24, thumb: "drawings/Drawing24.png", full: "drawings/Drawing24.png", description: "Sketch 24" },
  { id: 25, thumb: "drawings/Drawing25.png", full: "drawings/Drawing25.png", description: "Sketch 25" },
  
  { id: 26, thumb: "drawings/Drawing26.png", full: "drawings/Drawing26.png", description: "Sketch 26" }
];

/* =========================
   ELEMENTS
========================= */

const gallery = document.getElementById("gallery");
const modal = document.getElementById("modal");
const modalImage = document.getElementById("modalImage");
const modalText = document.getElementById("modalText");
const sortToggle = document.getElementById("sortToggle");
const sortSlider = document.getElementById("sortSlider");

/* =========================
   RENDER GALLERY
========================= */

function renderGallery() {

  const sorted = [...artworks].sort((a, b) =>
    sortOrder === "latest" ? b.id - a.id : a.id - b.id
  );

  gallery.innerHTML = "";

  sorted.forEach((art, index) => {

    const card = document.createElement("div");
    card.className = "cursor-pointer rounded-lg overflow-hidden bg-gray-800";

    card.innerHTML = `
      <img src="${art.thumb}" class="w-full h-auto block">

      <div class="bg-gray-800/80 border-t border-gray-700 px-3 py-2 flex justify-between items-start gap-2">

        <p class="text-sm text-gray-300 leading-5 h-[1.25rem] overflow-hidden flex-1">
          ${art.description}
        </p>

        <button class="text-gray-400 hover:text-white transition-transform">▼</button>

      </div>
    `;

    const btn = card.querySelector("button");
    const text = card.querySelector("p");

    // NEW: show arrow only if text overflows
    requestAnimationFrame(() => {
      const isOverflowing = text.scrollHeight > text.clientHeight + 1;
      if (!isOverflowing) {
        btn.style.display = "none";
      }
    });

    btn.addEventListener("click", (e) => {
      e.stopPropagation();

      const expanded = btn.dataset.open === "true";

      if (!expanded) {
        text.classList.remove("h-[1.25rem]", "overflow-hidden");
        btn.style.transform = "rotate(180deg)";
        btn.dataset.open = "true";
      } else {
        text.classList.add("h-[1.25rem]", "overflow-hidden");
        btn.style.transform = "rotate(0deg)";
        btn.dataset.open = "false";
      }
    });

    card.addEventListener("click", () => openModal(sorted, index));

    gallery.appendChild(card);
  });
}

/* =========================
   MODAL
========================= */

function openModal(images, index) {
  currentIndex = index;
  modalImage.src = images[currentIndex].full;
  modalText.textContent = images[currentIndex].description;
  modal.classList.add("opacity-100", "pointer-events-auto");
}

function showImage(offset) {

  const sorted = [...artworks].sort((a, b) =>
    sortOrder === "latest" ? b.id - a.id : a.id - b.id
  );

  currentIndex = (currentIndex + offset + sorted.length) % sorted.length;

  modalImage.src = sorted[currentIndex].full;
  modalText.textContent = sorted[currentIndex].description;
}

function closeModal() {
  modal.classList.remove("opacity-100", "pointer-events-auto");
  modalImage.src = "";
  modalText.textContent = "";
}

/* =========================
   SORT TOGGLE (FIXED)
========================= */

sortToggle.addEventListener("click", () => {

  sortOrder = sortOrder === "latest" ? "oldest" : "latest";

  sortSlider.style.transform =
    sortOrder === "latest" ? "translateX(0%)" : "translateX(100%)";

  renderGallery();
});

/* =========================
   EVENTS
========================= */

document.getElementById("prev").addEventListener("click", () => showImage(-1));
document.getElementById("next").addEventListener("click", () => showImage(1));

modal.addEventListener("click", (e) => {
  if (e.target === modal) closeModal();
});

document.addEventListener("keydown", (e) => {
  if (!modal.classList.contains("pointer-events-auto")) return;

  if (e.key === "ArrowRight") showImage(1);
  if (e.key === "ArrowLeft") showImage(-1);
  if (e.key === "Escape") closeModal();
});

/* INIT */
renderGallery();
document.getElementById("year").textContent = new Date().getFullYear();

</script>

</body>
</html>
